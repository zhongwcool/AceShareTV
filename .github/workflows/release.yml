name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          # versionCode base: major*10000 + minor*100 + patch (e.g. 1.2.3 -> 10203)
          # Gradle appends a device digit: TV +1, mobile +2.
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME}.0.0"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          VERSION_CODE_BASE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code_base=${VERSION_CODE_BASE}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.keystore"
            echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build release packages
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :tv:assembleGithubRelease :tv:bundlePlayRelease :mobile:assembleGithubRelease :mobile:bundlePlayRelease \
            -PVERSION_NAME="${{ steps.version.outputs.version_name }}" \
            -PVERSION_CODE_BASE="${{ steps.version.outputs.version_code_base }}"

      - name: Prepare release files
        run: |
          mkdir -p dist
          TAG="${{ steps.version.outputs.tag }}"
          TV_APK="$(find tv/build/outputs/apk/github/release -name '*.apk' | head -n 1)"
          MOBILE_APK="$(find mobile/build/outputs/apk/github/release -name '*.apk' | head -n 1)"
          TV_AAB="$(find tv/build/outputs/bundle/playRelease -name '*.aab' | head -n 1)"
          MOBILE_AAB="$(find mobile/build/outputs/bundle/playRelease -name '*.aab' | head -n 1)"
          cp "$TV_APK" "dist/AceShare-TV-${TAG}.apk"
          cp "$TV_AAB" "dist/AceShare-TV-${TAG}.aab"
          # Mobile APK must sort after AceShare-TV-*.apk. v1.1.0 and earlier
          # download the first .apk in GitHub's name order.
          cp "$MOBILE_APK" "dist/Mobile-AceShare-${TAG}.apk"
          cp "$MOBILE_AAB" "dist/Mobile-AceShare-${TAG}.aab"
          test -s "dist/AceShare-TV-${TAG}.apk"
          test -s "dist/AceShare-TV-${TAG}.aab"
          test -s "dist/Mobile-AceShare-${TAG}.apk"
          test -s "dist/Mobile-AceShare-${TAG}.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AceShare ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/AceShare-TV-${{ steps.version.outputs.tag }}.apk
            dist/AceShare-TV-${{ steps.version.outputs.tag }}.aab
            dist/Mobile-AceShare-${{ steps.version.outputs.tag }}.apk
            dist/Mobile-AceShare-${{ steps.version.outputs.tag }}.aab
